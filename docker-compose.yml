services:
  postgres:
    image: postgres:16-alpine
    container_name: smashbill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smashbill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smashbill_secret}
      POSTGRES_DB: ${POSTGRES_DB:-smashbill_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smashbill} -d ${POSTGRES_DB:-smashbill_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: smashbill-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-smashbill}:${POSTGRES_PASSWORD:-smashbill_secret}@postgres:5432/${POSTGRES_DB:-smashbill_db}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    deploy:
      resources:
        limits:
          memory: 300M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: smashbill-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 300M

volumes:
  postgres_data:
